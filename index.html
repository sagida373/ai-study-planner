<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f8fa"><meta name="description" content="A realistic weekly study plan. Recover missed sessions and approve every change."><title>AI Study Planner</title><style>:root {
  color-scheme: light;
  --canvas: #f7f8fa;
  --surface: #fff;
  --text: #182333;
  --muted: #75808d;
  --line: #e6e9ed;
  --soft: #f2f4f6;
  --accent: #17345e;
  --accent-hover: #102a4e;
  --accent-soft: #edf3fc;
  --amber: #956319;
  --amber-soft: #fff8e9;
  --danger: #a94747;
  --danger-soft: #fff1f1;
  --radius: 14px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  font-size: 14px;
  font-synthesis: none;
}
* { box-sizing: border-box; }
html { min-width: 320px; scroll-behavior: smooth; }
body { margin: 0; background: var(--canvas); color: var(--text); line-height: 1.5; }
button, input, select, textarea { font: inherit; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button, a { touch-action: manipulation; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
button, input, select, textarea { outline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); }
a { color: var(--accent); text-underline-offset: 3px; }
svg { display: inline-block; width: 20px; height: 20px; vertical-align: middle; flex-shrink: 0; }
button svg { pointer-events: none; }
h1, h2, h3, p { margin-top: 0; }
h1 { font-size: 30px; letter-spacing: -1px; line-height: 1.22; font-weight: 650; margin-bottom: 10px; }
h2 { font-size: 17px; letter-spacing: -.35px; line-height: 1.35; margin-bottom: 12px; font-weight: 650; }
h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; line-height: 1.4; }
p { margin-bottom: 14px; }
small { font-size: 12px; }
[hidden] { display: none !important; }
.shell { display: flex; min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; flex: 0 0 220px; padding: 30px 18px 22px; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 650; line-height: 1.25; letter-spacing: -.4px; padding: 0 8px; }
.brand-mark { display: inline-flex; align-items: center; justify-content: center; width: 35px; height: 35px; border-radius: 10px; color: #fff; background: var(--text); flex-shrink: 0; }
.brand-sub { color: var(--muted); font-size: 11px; letter-spacing: .1px; font-weight: 400; margin-top: 3px; }
.nav { display: flex; flex-direction: column; gap: 6px; margin-top: 42px; }
.nav-item { display: flex; align-items: center; gap: 12px; width: 100%; border: none; border-radius: 9px; padding: 12px 14px; text-align: left; color: #73808f; background: transparent; font-weight: 500; }
.nav-item svg { width: 18px; height: 18px; }
.nav-item:hover { background: #f6f7f8; color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.sidebar-foot { margin-top: auto; padding: 20px 9px 0; color: var(--muted); font-size: 12px; }
.sidebar-foot p { margin-bottom: 8px; }
.main { flex: 1 1 0; min-width: 0; }
.topbar { min-height: 76px; padding: 18px 32px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 18px; background: rgba(255,255,255,.85); }
.breadcrumbs { color: var(--muted); font-size: 13px; }
.breadcrumbs strong { color: var(--text); font-weight: 500; }
.top-actions { display: flex; align-items: center; gap: 17px; flex-wrap: wrap; }
.language { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; padding: 3px; background: #fff; }
.language button { border: 0; padding: 4px 7px; border-radius: 4px; background: transparent; color: var(--muted); font-size: 11px; line-height: 1.3; }
.language button.active, .language button[aria-pressed="true"] { color: var(--text); background: var(--soft); font-weight: 600; }
.saved-indicator { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.saved-indicator svg { width: 14px; height: 14px; color: var(--accent); }
.content { max-width: 1700px; padding: 32px; margin: 0 auto; }
.page-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 28px; }
.eyebrow, .welcome-kicker { color: var(--accent); font-size: 11px; letter-spacing: 1.7px; text-transform: uppercase; font-weight: 600; margin-bottom: 10px; }
.subtitle { color: var(--muted); max-width: 690px; margin: 0; line-height: 1.6; font-size: 14px; }
.header-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; flex-shrink: 0; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat { padding: 21px 23px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.stat-label { color: var(--muted); font-size: 12px; font-weight: 500; margin-bottom: 9px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stat-label svg { width: 16px; height: 16px; color: #929ca6; }

.stat-detail { color: var(--muted); font-size: 12px; margin-top: 7px; }
.stat.warning .stat-value { color: var(--amber); }
.stat.teal .stat-value { color: var(--accent); }
.workspace { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 22px; align-items: start; }
.right-column, .section-stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); min-width: 0; }
.panel-header { padding: 21px 22px 17px; display: flex; justify-content: space-between; align-items: center; gap: 15px; }
.panel-header h2, .panel-header h3, .panel-header p { margin-bottom: 0; }
.panel-header p { color: var(--muted); font-size: 12px; margin-top: 5px; }
.panel-body { padding: 0 22px 22px; }
.plan-panel { overflow: hidden; }
.week-toolbar { padding: 0 22px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
.week-toolbar strong { color: var(--text); font-weight: 500; }
.week-grid { width: 100%; display: grid; grid-template-columns: repeat(7,minmax(106px,1fr)); overflow-x: auto; border-top: 1px solid var(--line); scrollbar-width: thin; scrollbar-color: #d5dbdf transparent; }
.day-column { min-height: 365px; border-right: 1px solid var(--line); padding: 0 7px 13px; }
.day-column:last-child { border-right: 0; }
.day-head { padding: 15px 2px 14px; font-size: 11px; color: var(--muted); text-align: center; font-weight: 500; border-bottom: 1px solid #f0f2f4; margin-bottom: 11px; }
.day-date { display: block; margin-top: 5px; color: var(--text); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.day-column.today .day-date { color: var(--accent); }
.session { padding: 10px 8px 8px; background: var(--accent-soft); border: 1px solid #dbe1ec; border-left: 3px solid #5e739d; border-radius: 7px; margin-bottom: 8px; overflow-wrap: anywhere; }
.session-time { color: #5d6982; font-size: 10px; margin-bottom: 5px; font-variant-numeric: tabular-nums; }
.session-title { font-size: 12px; line-height: 1.4; font-weight: 600; margin-bottom: 3px; }
.session-course { color: #717887; font-size: 10px; line-height: 1.4; }
.session-actions { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
.session-actions button { font-size: 10px; border: 1px solid #cdd3df; border-radius: 4px; color: #42506c; background: #fff; padding: 3px 5px; min-height: 25px; }
.session.completed { border-color: #e4e5e8; border-left-color: #aeb3bd; background: #f4f5f6; }
.session.completed .session-title { color: #7b7f88; text-decoration: line-through; }
.session.missed { border-color: #f0e2c7; border-left-color: #c49c58; background: #fff8ed; }
.session.missed .session-time, .session.missed .session-course { color: #997b4a; }
.day-free { color: #a0a9b1; font-size: 11px; text-align: center; margin: 23px 0 10px; line-height: 1.6; }
.task-list { padding: 0 20px 9px; }
.task-row { padding: 15px 0; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; min-width: 0; }
.task-row:first-child { border-top: 0; padding-top: 3px; }
.task-main { flex: 1; min-width: 0; }
.task-main strong { display: block; font-size: 13px; line-height: 1.45; font-weight: 550; overflow-wrap: anywhere; }
.task-dot { width: 7px; height: 7px; border-radius: 50%; background: #6b7b9a; flex-shrink: 0; }
.task-dot.high { background: #cf9b61; }
.task-dot.low { background: #9fa9b3; }
.task-meta { color: var(--muted); font-size: 11px; line-height: 1.5; margin-top: 4px; }
.task-hours { font-size: 12px; white-space: nowrap; color: #75828d; font-variant-numeric: tabular-nums; }
.notice { padding: 13px 15px; border: 1px solid var(--line); border-radius: 9px; color: #657280; background: #f7f9fa; font-size: 13px; line-height: 1.6; }
.notice p:last-child { margin-bottom: 0; }
.notice.warning { background: var(--amber-soft); border-color: #f1e4c5; color: #8b682d; }
.notice.success { background: var(--accent-soft); border-color: #d8deea; color: #3d5075; }
.notice.error { background: var(--danger-soft); border-color: #efd6d6; color: var(--danger); }
.empty-state { padding: 38px 25px; text-align: center; color: var(--muted); }
.empty-state svg { width: 28px; height: 28px; color: #a7acb6; margin-bottom: 14px; }
.empty-state h3 { color: var(--text); font-weight: 500; }
.empty-state p { max-width: 350px; margin: 0 auto 20px; font-size: 13px; }
.step-list { padding: 0 22px 20px; list-style: none; margin: 0; }
.step-list li { display: flex; align-items: flex-start; gap: 11px; padding: 10px 0; color: #647180; font-size: 12px; }
.step-number { width: 22px; height: 22px; border: 1px solid #e4e6e9; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: var(--accent); flex-shrink: 0; }
.change-card { padding: 20px; border: 1px solid var(--line); background: #fff; border-radius: 12px; }
.change-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; }
.change-title { font-weight: 600; font-size: 15px; line-height: 1.4; }
.change-time { color: var(--accent); font-size: 13px; font-weight: 500; margin: 10px 0 8px; }
.change-reason { color: var(--muted); font-size: 13px; line-height: 1.6; margin-bottom: 18px; }
.change-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 39px; padding: 9px 15px; border: 1px solid transparent; border-radius: 7px; font-size: 13px; font-weight: 500; line-height: 1.35; text-decoration: none; transition: background .15s, border-color .15s; white-space: nowrap; }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.secondary { background: #fff; border-color: #dce1e6; color: #485769; }
.btn.secondary:hover { background: #f6f8f9; border-color: #cbd3db; }
.btn.ghost { background: transparent; color: #74818e; border-color: transparent; }
.btn.ghost:hover { background: #edf1f3; color: var(--text); }
.btn.danger { color: var(--danger); border-color: #edcece; background: #fff; }
.btn.danger:hover { background: var(--danger-soft); }
.btn.small { min-height: 32px; padding: 6px 10px; font-size: 12px; }
.icon-button { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; color: #8d98a3; flex-shrink: 0; }
.icon-button:hover { background: #f0f3f5; color: var(--text); }
.icon-button svg { width: 16px; height: 16px; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 5px; background: #f0f3f5; color: #7b8792; font-size: 10px; font-weight: 500; line-height: 1.3; white-space: nowrap; }
.badge.muted { background: #f1f3f5; color: #7c8792; }
.badge.teal { background: var(--accent-soft); color: var(--accent); }
.badge.amber { background: var(--amber-soft); color: var(--amber); }
.form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px; }
.field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.field.full { grid-column: 1/-1; }
.field label, label.field { color: #596675; font-size: 12px; font-weight: 500; }
.field small, .field .hint { color: var(--muted); font-size: 11px; font-weight: 400; }
input:not([type="checkbox"]):not([type="radio"]), select, textarea { width: 100%; min-width: 0; border: 1px solid #dce2e7; border-radius: 7px; background: #fff; color: var(--text); padding: 10px 11px; min-height: 40px; }
input::placeholder, textarea::placeholder { color: #a1a9b1; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }
textarea { resize: vertical; min-height: 110px; }
.form-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 23px; flex-wrap: wrap; }
.availability-row { display: grid; grid-template-columns: 1.25fr 1fr 1fr auto; gap: 13px; padding: 13px 0; border-bottom: 1px solid var(--line); align-items: center; }
.availability-row:last-child { border-bottom: 0; }
.availability-row > span:first-child { font-size: 13px; font-weight: 500; }
.feedback-item { border-top: 1px solid var(--line); padding: 17px 0; }
.feedback-item:first-child { border-top: 0; }
.feedback-item p { margin: 8px 0; color: #697584; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.modal-overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(21,31,42,.33); backdrop-filter: blur(2px); padding: 24px; overflow-y: auto; }
.modal { width: min(560px,100%); max-height: calc(100dvh - 48px); padding: 0; background: #fff; color: var(--text); border: 1px solid #e2e6e9; border-radius: 16px; box-shadow: 0 20px 80px rgba(26,39,50,.14); overflow-y: auto; }
dialog.modal::backdrop { background: rgba(21,31,42,.33); backdrop-filter: blur(2px); }
.modal-header { padding: 24px 25px 18px; display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; }
.modal-header h2 { margin: 0; font-size: 19px; }
.modal-body { padding: 2px 25px 25px; }
.modal-body p { color: #6a7683; font-size: 13px; line-height: 1.65; }
.modal-footer { padding: 17px 25px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 9px; }
.dialog-close { display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; color: var(--muted); width: 26px; height: 26px; border-radius: 5px; font-size: 22px; line-height: 1; }
.dialog-close:hover { background: var(--soft); color: var(--text); }
.toast { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 200; padding: 12px 19px; border-radius: 9px; background: var(--text); color: #fff; box-shadow: 0 4px 20px #17232e1a; font-size: 13px; max-width: min(520px,calc(100vw - 32px)); text-align: center; }
.welcome { min-height: calc(100vh - 160px); display: grid; grid-template-columns: minmax(0,1fr) minmax(340px, .85fr); gap: clamp(36px,6vw,100px); align-items: center; max-width: 1080px; margin: 0 auto; padding: 24px 0 70px; }
.welcome-copy h1 { font-size: clamp(34px,3.5vw,48px); letter-spacing: -1.8px; line-height: 1.17; max-width: 600px; margin-bottom: 24px; font-weight: 600; }
.welcome-copy > p { color: var(--muted); line-height: 1.8; font-size: 15px; max-width: 490px; }
.welcome-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
.welcome-buttons .btn { padding: 12px 18px; }
.welcome-preview { position: relative; padding: 24px; background: #eeeff2; border: 1px solid #e5e7ea; border-radius: 20px; }
.preview-card { background: #fff; padding: 23px; border: 1px solid #e0e2e6; border-radius: 12px; box-shadow: 0 6px 22px rgba(36,58,46,.04); }
.preview-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 20px; font-size: 13px; font-weight: 600; }
.preview-line { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid #eeeff1; font-size: 12px; }
.preview-line > span:first-child { color: #9397a0; min-width: 42px; font-size: 11px; }
.preview-line strong { display: block; font-size: 12px; font-weight: 550; }
.preview-line small { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }
.preview-change { background: var(--accent-soft); border: 1px solid #d8dee9; padding: 15px; margin-top: 15px; border-radius: 8px; font-size: 12px; color: #4d5b77; }

.preview-change p:last-child { margin-bottom: 0; }
.footer-note { color: #909aa4; font-size: 11px; margin-top: 22px; line-height: 1.6; }
.progress-bar { height: 4px; background: #eeeff2; border-radius: 5px; overflow: hidden; margin-top: 12px; }
.progress-bar > span, .progress-bar > div { height: 100%; display: block; background: #6479a2; border-radius: inherit; }
.review-layout { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 24px; align-items: start; }
.metric-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; gap: 15px; font-size: 13px; color: #74808d; }
.metric-row strong { color: var(--text); font-weight: 500; }
.divider { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.text-muted { color: var(--muted); }
.text-small { font-size: 12px; }
.text-accent { color: var(--accent); }
.text-right { text-align: right; }
.inline-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spaced { margin-top: 20px; }
.welcome-shell .welcome { padding-left: 24px; padding-right: 24px; }
.sidebar-tagline { padding-left: 53px; margin-top: 8px; line-height: 1.5; }
.nav-count { margin-left: auto; font-size: 10px; padding: 1px 5px; border-radius: 4px; background: #e6e8ec; color: #656e81; }
.saved-indicator > span { width: 5px; height: 5px; background: #7083a9; border-radius: 50%; flex-shrink: 0; }
.text-button { border: 0; background: transparent; color: #778590; padding: 4px 0; display: inline-flex; gap: 6px; align-items: center; font-size: 11px; }
.text-button:hover { color: var(--accent); }
.text-button svg { width: 13px; height: 13px; }
.week-scroll { width: 100%; overflow-x: auto; scrollbar-width: thin; scrollbar-color: #d5dbdf transparent; }
.week-scroll .week-grid { overflow: visible; min-width: 780px; }
.day-capacity { font-size: 10px; color: #a2abb3; text-align: center; border-top: 1px dashed #e9ecee; padding-top: 9px; margin-top: 14px; }
.session-status { color: #838892; font-size: 10px; margin-top: 8px; }
.session.missed .session-status { color: #a3885b; }
.session-actions button svg { width: 11px; height: 11px; margin-right: 2px; }
.plan-note { padding: 12px 20px; border-top: 1px solid var(--line); margin: 0; display: flex; gap: 7px; align-items: center; }
.plan-note svg { width: 13px; height: 13px; }
.btn.full { width: 100%; }
.stat-warning .stat-value, .warning-text { color: var(--amber); }
.muted-text { color: var(--muted); }
.task-detail-row { display: flex; align-items: center; gap: 15px; padding: 20px 23px; border-top: 1px solid var(--line); }

.task-detail-row h3 { margin-bottom: 3px; }
.task-detail-row > .badge { align-self: center; }
.availability-day .availability-row { grid-template-columns: 1fr auto; padding: 8px 0; }

.availability-day .availability-row svg { width: 15px; height: 15px; color: #898e97; }
.availability-day .panel-body > p:last-child { margin-bottom: 0; font-size: 12px; }
.review-summary { position: sticky; top: 25px; }
.form-error { font-size: 12px; color: var(--danger) !important; margin: 0; }
.form-grid > .form-actions, .form-grid > .form-error, .form-grid > p, .form-grid > div:last-child:not(.field) { grid-column: 1/-1; }
.form-grid > .form-actions { margin-top: 3px; }

#feedback-form .field:has(textarea) { grid-column: 1/-1; }
.preview-change { display: grid; grid-template-columns: 1fr 18px 1fr; gap: 10px; align-items: center; }
.preview-change p { margin: 9px 0 0; font-size: 11px; }
.preview-change > svg { width: 16px; height: 16px; color: #838da2; }
.preview-bottom { display: flex; align-items: center; gap: 7px; margin-top: 18px; color: #868a93; font-size: 11px; }
.preview-bottom svg { width: 14px; height: 14px; color: #687897; }
.preview-line .task-dot { min-width: 7px !important; width: 7px; height: 7px; }
.empty-icon { display: inline-flex; }
.content > .notice { margin-top: 20px; }
@media (min-width: 1600px) { .content { padding: 38px 42px; } .topbar { padding-left: 42px; padding-right: 42px; } }
@media (max-width: 1250px) {
  .workspace { grid-template-columns: minmax(0,1fr); }
  .right-column { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); align-items: start; }
  .welcome { gap: 35px; }
}
@media (max-width: 1000px) {

<body><div id="app"></div><div id="modal-root"></div><div id="toast" class="toast" role="status" aria-live="polite" hidden></div><script type="module">/** Pure one-week scheduling rules. All offsets are minutes from Monday 00:00. */
const SLOT_MINUTES = 30;
const WEEK_MINUTES = 7 * 24 * 60;

const priorities = { high: 0, medium: 1, low: 2 };
const clone = value => JSON.parse(JSON.stringify(value));
const overlaps = (a, b) => a.start < b.end && b.start < a.end;
const minutes = session => session.end - session.start;
const roundUp = value => Math.ceil(value / SLOT_MINUTES) * SLOT_MINUTES;

function parseTime(value, end = false) {
  if (typeof value !== 'string' || !/^\d{2}:\d{2}$/.test(value)) return NaN;
  const [h, m] = value.split(':').map(Number);
  if (m > 59 || h > 24 || h === 24 && (!end || m !== 0)) return NaN;
  return h * 60 + m;
}

function availabilityRanges(state) {
  return state.availability.map(a => ({
    start: a.day * 1440 + parseTime(a.start),
    end: a.day * 1440 + parseTime(a.end, true),
  })).sort((a, b) => a.start - b.start);
}

function availableSlots(state, occupied = []) {
  const slots = [];
  for (const range of availabilityRanges(state)) {
    for (let start = roundUp(Math.max(range.start, state.now)); start + SLOT_MINUTES <= range.end; start += SLOT_MINUTES) {
      const slot = { start, end: start + SLOT_MINUTES };
      if (!occupied.some(s => overlaps(slot, s))) slots.push(slot);
    }
  }
  return slots;
}

/** Validate inputs without mutating or discarding user data. */
function validateState(state) {
  const errors = [];
  if (!state || typeof state !== 'object') return { valid: false, errors: ['Planner data is missing.'] };
  if (!Array.isArray(state.tasks)) errors.push('Tasks must be a list.');
  if (!Array.isArray(state.availability)) errors.push('Available study periods must be a list.');
  if (!Array.isArray(state.sessions)) errors.push('Study sessions must be a list.');
  if (state.rejectedProposals !== undefined && (!Array.isArray(state.rejectedProposals) || state.rejectedProposals.some(id => typeof id !== 'string'))) errors.push('Saved suggestion decisions are invalid.');
  if (!Number.isFinite(state.now) || state.now < 0 || state.now > WEEK_MINUTES) errors.push('The planning time must be inside this week.');
  if (errors.length) return { valid: false, errors };
  const ids = new Set();
  for (const task of state.tasks) {
    if (!task || typeof task.id !== 'string' || !task.id || ids.has(task.id)) errors.push('Every task needs a unique ID.');
    if (task?.id) ids.add(task.id);
    if (typeof task?.title !== 'string' || !task.title.trim()) errors.push('Every task needs a title.');
    if (!Number.isInteger(task?.duration) || task.duration <= 0 || task.duration > WEEK_MINUTES || task.duration % SLOT_MINUTES) errors.push('Task durations must use positive 30-minute units.');
    if (!Number.isInteger(task?.deadline) || task.deadline < 1 || task.deadline > WEEK_MINUTES) errors.push('Every deadline must be inside this planning week.');
    if (!(task?.priority in priorities)) errors.push('Task priority must be high, medium, or low.');
  }
  const availabilityIds = new Set();
  for (const a of state.availability) {
    if (!a || typeof a.id !== 'string' || !a.id || availabilityIds.has(a.id)) errors.push('Every study period needs a unique ID.');
    if (a?.id) availabilityIds.add(a.id);
    const start = parseTime(a?.start), end = parseTime(a?.end, true);
    if (!Number.isInteger(a?.day) || a.day < 0 || a.day > 6 || !Number.isFinite(start) || !Number.isFinite(end) || end <= start) errors.push('Study periods need a valid day and an end time after their start time.');
    else if (start % SLOT_MINUTES || end % SLOT_MINUTES) errors.push('Available study periods must start and end on a half hour.');
  }
  if (!errors.length) {
    const ranges = availabilityRanges(state);
    if (ranges.some((r, i) => i > 0 && overlaps(ranges[i - 1], r))) errors.push('Available study periods cannot overlap.');
  }
  const sessionIds = new Set();
  for (const s of state.sessions) {
    if (!s || typeof s.id !== 'string' || !s.id || sessionIds.has(s.id)) errors.push('Every study session needs a unique ID.');
    if (s?.id) sessionIds.add(s.id);
    if (!ids.has(s?.taskId)) errors.push('A study session refers to a task that no longer exists.');
    if (!Number.isInteger(s?.start) || !Number.isInteger(s?.end) || s.start < 0 || s.end > WEEK_MINUTES || s.end <= s.start || (s.end - s.start) % SLOT_MINUTES) errors.push('Study sessions must have a valid duration in 30-minute units.');
    if (!['planned', 'completed', 'missed'].includes(s?.status)) errors.push('A study session has an invalid status.');
  }
  return { valid: !errors.length, errors: [...new Set(errors)] };
}

/** Check accepted sessions against all hard constraints. Missed work never counts as completed. */
function validatePlan(state, sessions = state?.sessions) {
  const basic = validateState({ ...state, sessions });
  if (!basic.valid) return basic;
  const errors = [];
  const ranges = availabilityRanges(state);
  const active = sessions.filter(s => s.status !== 'missed');
  for (const session of sessions.filter(s => s.status === 'planned')) {
    const task = state.tasks.find(t => t.id === session.taskId);
    if (session.start < state.now) errors.push(`“${task.title}” is scheduled in the past.`);
    if (session.end > task.deadline) errors.push(`“${task.title}” would finish after its deadline.`);
    if (!ranges.some(r => session.start >= r.start && session.end <= r.end)) errors.push(`“${task.title}” is outside your available study hours.`);
    if (sessions.some(other => other.status === 'missed' && overlaps(session, other))) errors.push(`“${task.title}” overlaps a missed study period.`);
  }
  const sorted = [...active].sort((a, b) => a.start - b.start || a.end - b.end);
  if (sorted.some((s, i) => i > 0 && overlaps(sorted[i - 1], s))) errors.push('Study sessions overlap.');
  for (const task of state.tasks) {
    const allocated = active.filter(s => s.taskId === task.id).reduce((sum, s) => sum + minutes(s), 0);
    if (allocated > task.duration) errors.push(`“${task.title}” has more completed and planned time than it needs.`);
  }
  return { valid: !errors.length, errors: [...new Set(errors)] };
}

function summarize(state, sessions) {
  const byTask = state.tasks.map(task => {
    const own = sessions.filter(s => s.taskId === task.id);
    const completed = own.filter(s => s.status === 'completed').reduce((sum, s) => sum + minutes(s), 0);
    const planned = own.filter(s => s.status === 'planned').reduce((sum, s) => sum + minutes(s), 0);
    return { taskId: task.id, required: task.duration, completed, planned, unscheduled: Math.max(0, task.duration - completed - planned) };
  });
  const sum = key => byTask.reduce((total, t) => total + t[key], 0);
  return {
    required: sum('required'), completed: sum('completed'), planned: sum('planned'), unscheduled: sum('unscheduled'),
    available: availableSlots(state).length * SLOT_MINUTES,
    free: availableSlots(state, sessions).length * SLOT_MINUTES,
    byTask,
  };
}

function invalidResult(state, errors) {
  return { sessions: Array.isArray(state?.sessions) ? clone(state.sessions) : [], summary: null, errors };
}

/** Earliest-deadline scheduling. Existing approved sessions remain fixed unless explicitly reset. */
function buildPlan(state, { preserveApproved = true } = {}) {
  const basic = validateState(state);
  if (!basic.valid) return invalidResult(state, basic.errors);
  const sessions = clone(state.sessions.filter(s => preserveApproved || s.status !== 'planned'));
  const valid = validatePlan(state, sessions);
  if (!valid.valid) return invalidResult(state, valid.errors);
  const free = availableSlots(state, sessions);
  const tasks = [...state.tasks].sort((a, b) => a.deadline - b.deadline || priorities[a.priority] - priorities[b.priority] || a.id.localeCompare(b.id));
  for (const task of tasks) {
    const accounted = sessions.filter(s => s.taskId === task.id && s.status !== 'missed').reduce((sum, s) => sum + minutes(s), 0);
    let remaining = Math.max(0, task.duration - accounted);
    let previous = null;
    for (let i = 0; i < free.length && remaining > 0; i++) {
      const slot = free[i];
      if (!slot || slot.end > task.deadline) continue;
      if (previous && previous.end === slot.start && availabilityRanges(state).some(r => previous.start >= r.start && slot.end <= r.end)) {
        previous.end = slot.end;
        previous.id = `auto-${task.id}-${previous.start}-${previous.end}`;
      } else {
        previous = { id: `auto-${task.id}-${slot.start}-${slot.end}`, taskId: task.id, start: slot.start, end: slot.end, status: 'planned' };
        sessions.push(previous);
      }
      free[i] = null;
      remaining -= SLOT_MINUTES;
    }
  }
  sessions.sort((a, b) => a.start - b.start || a.id.localeCompare(b.id));
  return { sessions, summary: summarize(state, sessions), errors: [] };
}

/** Recovery suggestions only add sessions; they do not move already accepted sessions. */
function proposeChanges(state) {
  const result = buildPlan(state);
  if (result.errors.length) return { proposals: [], summary: null, projectedSummary: null, errors: result.errors };
  const existing = new Set(state.sessions.map(s => s.id));
  const suppressed = new Set(state.rejectedProposals || []);
  const proposals = result.sessions.filter(s => !existing.has(s.id)).map(s => {
    const task = state.tasks.find(t => t.id === s.taskId);
    return {
      id: `proposal-${s.taskId}-${s.start}-${s.end}`, taskId: s.taskId, start: s.start, end: s.end,
      reason: `Place ${minutes(s)} minutes of unfinished work before the deadline, inside your available hours. Your accepted sessions stay where they are.`,
      title: task.title,
    };
  }).filter(p => !suppressed.has(p.id));
  const projected = [...state.sessions, ...proposals.map(p => ({ ...p, id: `auto-${p.taskId}-${p.start}-${p.end}`, status: 'planned' }))];
  return { proposals, summary: summarize(state, state.sessions), projectedSummary: summarize(state, projected), errors: [] };
}

/** Accept, edit, or reject a single suggestion with no hidden changes to other sessions. */
function applyProposal(state, proposal, action, customStart) {
  const basic = validateState(state);
  if (!basic.valid) return { ok: false, state, error: basic.errors[0] };
  if (!['accept', 'edit', 'reject'].includes(action)) return { ok: false, state, error: 'Choose accept, edit, or reject.' };
  const task = state.tasks.find(t => t.id === proposal?.taskId);
  if (!task || typeof proposal?.id !== 'string' || !Number.isInteger(proposal?.start) || !Number.isInteger(proposal?.end) || proposal.end <= proposal.start) return { ok: false, state, error: 'This suggestion is no longer valid. Review the plan again.' };
  const next = clone(state);
  if (action === 'reject') {
    next.rejectedProposals = [...new Set([...(next.rejectedProposals || []), proposal.id])];
    return { ok: true, state: next };
  }
  const start = action === 'edit' ? customStart : proposal.start;
  if (!Number.isInteger(start) || start % SLOT_MINUTES) return { ok: false, state, error: 'Choose a start time on a half hour.' };
  const duration = proposal.end - proposal.start;
  const session = { id: `auto-${proposal.taskId}-${start}-${start + duration}`, taskId: proposal.taskId, start, end: start + duration, status: 'planned' };
  const validation = validatePlan(state, [...next.sessions, session]);
  if (!validation.valid) return { ok: false, state, error: validation.errors[0] };
  next.sessions.push(session);
  next.sessions.sort((a, b) => a.start - b.start || a.id.localeCompare(b.id));
  next.rejectedProposals = (next.rejectedProposals || []).filter(id => !id.startsWith(`proposal-${task.id}-`));
  return { ok: true, state: next };
}

function trainClassifier(groups){const vocabulary=new Set(),labels={};for(const [label,docs] of Object.entries(groups)){const counts={},uniqueDocs=docs.map(tokens);let total=0;for(const words of uniqueDocs)for(const w of words){vocabulary.add(w);counts[w]=(counts[w]||0)+1;total++;}labels[label]={counts,total,prior:docs.length};}return{labels,vocabulary};}

function classify(model,text){const words=tokens(text).filter(w=>model.vocabulary.has(w));const ranked=Object.entries(model.labels).map(([label,d])=>({label,score:words.reduce((s,w)=>s+Math.log(((d.counts[w]||0)+1)/(d.total+model.vocabulary.size)),Math.log(d.prior))})).sort((a,b)=>b.score-a.score);const e=ranked.map(x=>Math.exp(x.score-ranked[0].score)),sum=e.reduce((a,b)=>a+b,0);return{label:ranked[0].label,known:words.length,score:e[0]/sum,margin:ranked[0].score-ranked[1].score};}

function classifyIntent(text){return classify(intentModel,text).label;}

const demoTraining=taskTypes.flatMap(type=>[0,1,2].flatMap(difficulty=>[1,3,6,10].map(units=>({type,difficulty,units,minutes:Math.min(600,Math.round(bases[type]*(1+.45*difficulty)*(1+.48*Math.log2(units)))),source:'illustrative'}))));
function trainDuration(userExamples=[]){
 const rows=[...demoTraining.map(x=>({...x,weight:1})),...userExamples.filter(validExample).map(x=>({...x,weight:8}))];
 const n=features(rows[0]).length,A=Array.from({length:n},()=>Array(n+1).fill(0));
 for(const row of rows){const v=features(row),y=Math.log(row.minutes),w=row.weight;for(let i=0;i<n;i++){for(let j=0;j<n;j++)A[i][j]+=w*v[i]*v[j];A[i][n]+=w*v[i]*y;}}
 for(let i=0;i<n;i++)A[i][i]+=.12;
 for(let i=0;i<n;i++){let pivot=i;for(let k=i+1;k<n;k++)if(Math.abs(A[k][i])>Math.abs(A[pivot][i]))pivot=k;[A[i],A[pivot]]=[A[pivot],A[i]];const div=A[i][i];if(Math.abs(div)<1e-10)throw Error('Model training failed');for(let j=i;j<=n;j++)A[i][j]/=div;for(let k=0;k<n;k++){if(k===i)continue;const f=A[k][i];for(let j=i;j<=n;j++)A[k][j]-=f*A[i][j];}}
 return {weights:A.map(r=>r[n]),userCount:userExamples.filter(validExample).length,seedCount:demoTraining.length};
}

function parseRequest(text,{week,now=0}={}){
 const lines=String(text).split(/[\n;]+/).map(x=>x.trim()).filter(Boolean);if(!lines.length||lines.length>5||text.length>1500)return{error:'size',drafts:[]};
 const drafts=lines.map(line=>{
  const norm=normalize(line),num=numeric(line),words=tokens(line),kind=classifyTask(line);
  const intent=classifyIntent(line);if(intent==='recover')return{intent:'recover',text:line};
  let day=null,unsupported=false;const iso=norm.match(/\b(20\d{2}-\d{2}-\d{2})\b/);
  if(iso){const anchor=Date.parse(week+'T12:00:00Z'),date=Date.parse(iso[1]+'T12:00:00Z'),offset=(date-anchor)/86400000;if(Number.isInteger(offset)&&offset>=0&&offset<=6)day=offset;else unsupported=true;}
  if(!iso){for(let i=0;i<7;i++)if(dayWords[i].some(w=>words.includes(w)))day=i;
   if(/\b(?:today|сегодня)\b/u.test(norm)||words.includes('бүгін'))day=Math.floor(now/1440);
   if(/\b(?:tomorrow|завтра)\b/u.test(norm)||words.includes('ертең'))day=Math.floor(now/1440)+1;
  }
  if(day>6||/(next week|следующ[^ ]* недел|келесі апта)/u.test(norm))unsupported=true;
  const clock=norm.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);const deadlineTime=clock?`${clock[1].padStart(2,'0')}:${clock[2]}`:'18:00';
  const duration=num.match(/(\d+(?:[.,]\d+)?)\s*(hours?|hrs?|h\b|час[а-я]*|сағат)/u),mins=num.match(/(\d+)\s*(minutes?|mins?|минут[а-я]*|мин\b)/u);
  let explicitMinutes=duration?Math.round(Number(duration[1].replace(',','.'))*60):0;if(mins)explicitMinutes+=Number(mins[1]);
  const unitsMatch=num.match(/(\d+)\s*(pages?|questions?|exercises?|problems?|страниц[а-я]*|вопрос[а-я]*|задач[а-я]*|упражнен[а-я]*|бет|есеп|сұрақ|тапсырма)/u);
  const difficulty=/(medium|moderate|средн|орташа)/u.test(norm)?1:/(easy|simple|легк|прост|оңай|жеңіл)/u.test(norm)?0:/(hard|difficult\b|сложн|трудн|қиын|күрделі)/u.test(norm)?2:1;
  let title=line.split(',').filter((part,i)=>i===0||!/(\d+\s*(hour|minute|час|минут|сағат)|due\b|deadline|дедлайн|мерзім|\d{1,2}:\d{2}|difficulty|сложност|қиындық)/iu.test(numeric(part))).join(', ').trim();if(!title)title=line;
  title=title.replace(/^(please\s+)?(add\s+(a\s+)?task[:\s]*|schedule\s+|добавь\s+(задание[:\s]*)?)/iu,'').trim().slice(0,80);
  let course=/python/iu.test(line)?'Python':/sql|database|баз[а-я]* данных|деректер қоры/iu.test(line)?'Databases':/math|математ|алгебр/iu.test(line)?'Mathematics':'';
  return{intent:'create',title,course,type:kind.label,recognized:kind.known>0,day:unsupported?null:day,deadlineTime,defaultTime:!clock,explicitMinutes:explicitMinutes||null,difficulty,units:unitsMatch?Number(unitsMatch[1]):1,priority:/(urgent|high priority|срочно|срочн|шұғыл)/u.test(norm)?'high':'medium',unsupported};
 });
 return{drafts};
}

  const probe = document.createElement('canvas'), m = probe.getContext('2d');
  if (!m) throw new Error('Canvas is unavailable.');
  const label = (key, fallback = key) => { const value = t(key); return value && value !== key ? value : fallback; };
  const clock = value => `${String(Math.floor((value % 1440) / 60)).padStart(2, '0')}:${String(value % 60).padStart(2, '0')}`;
  const endClock = value => value > 0 && value % 1440 === 0 ? '24:00' : clock(value);
  const text = value => String(value ?? '').replace(/\r\n?/g, '\n');
  const wrap = (value, maxWidth, size = 26, weight = 400) => {
    m.font = `${weight} ${size}px ${font}`;
    const lines = [];
    for (const paragraph of text(value).split('\n')) {
      const words = paragraph.split(/\s+/u).filter(Boolean);
      if (!words.length) { lines.push(''); continue; }
      let current = '';
      for (const word of words) {
        const trial = current ? `${current} ${word}` : word;
        if (m.measureText(trial).width <= maxWidth) { current = trial; continue; }
        if (current) { lines.push(current); current = ''; }
        // Break an exceptionally long single word by Unicode code points, retaining every character.
        for (const char of [...word]) {
          if (current && m.measureText(current + char).width > maxWidth) { lines.push(current); current = ''; }
          current += char;
        }
      }
      if (current) lines.push(current);
    }
    return lines;
  };
  const tasks = Array.isArray(state.tasks) ? state.tasks : [];
  const sessions = Array.isArray(state.sessions) ? state.sessions : [];
  const events = Array.isArray(state.events) ? state.events : [];
  const availability = Array.isArray(state.availability) ? state.availability : [];
  const taskMap = new Map(tasks.map(task => [task.id, task]));
  const contentWidth = INNER - DAY_LABEL - 48;
  const blocks = [];
  const cardBlock = (day, title, meta, notes = '', kind = 'study', status = '') => {
    const titleLines = wrap(title, contentWidth, 27, 600);
    const metaLines = wrap(meta, contentWidth, 22);
    const noteLines = notes ? wrap(notes, contentWidth, 22) : [];
    const lineItems = [
      ...titleLines.map(value => ({ value, size: 27, weight: 600, color: C.text, advance: 35 })),
      ...metaLines.map(value => ({ value, size: 22, weight: 400, color: C.muted, advance: 30 })),
      ...noteLines.map(value => ({ value, size: 22, weight: 400, color: C.muted, advance: 30 })),
    ];
    // Splitting exceptionally long notes into separate cards keeps every page inside Canvas limits.
    const limit = MAX_HEIGHT - HEADER - FOOTER - 150;
    let chunk = [], height = 40;
    for (const item of lineItems) {
      if (height + item.advance > limit && chunk.length) {
        blocks.push({ type: 'card', day, lines: chunk, height: height + 16, kind, status });
        chunk = []; height = 40;
      }
      chunk.push(item); height += item.advance;
    }
    if (chunk.length) blocks.push({ type: 'card', day, lines: chunk, height: Math.max(114, height + 16), kind, status });
  };
  for (let day = 0; day < 7; day++) {
    blocks.push({ type: 'day', day, height: 70 });
    const items = [
      ...sessions.filter(s => Math.floor(s.start / 1440) === day).map(s => ({ ...s, itemType: 'session' })),
      ...events.filter(e => Math.floor(e.start / 1440) === day).map(e => ({ ...e, itemType: 'event' })),
    ].sort((a, b) => a.start - b.start || a.end - b.end || String(a.id).localeCompare(String(b.id)));
    if (!items.length) blocks.push({ type: 'empty', day, height: 62 });
    for (const item of items) {
      if (item.itemType === 'session') {
        const task = taskMap.get(item.taskId);
        if (!task) continue;
        const status = item.status === 'completed' ? label('completed') : item.status === 'missed' ? label('missedSession') : label('planned');
        const category = task.category === 'personal' ? label('personalTask', 'Personal task') : label('study', 'Study');
        const meta = [`${clock(item.start)}–${endClock(item.end)}`, fmt(item.end - item.start), category, task.course, status].filter(Boolean).join('  ·  ');
        cardBlock(day, task.title, meta, task.notes || '', task.category === 'personal' ? 'personal' : 'study', item.status);
      } else {
        const category = item.category === 'class' ? label('classEvent', 'Class') : item.category === 'break' ? label('breakEvent', 'Break') : label('personalEvent', 'Personal event');
        cardBlock(day, item.title, `${clock(item.start)}–${endClock(item.end)}  ·  ${fmt(item.end - item.start)}  ·  ${category}`, item.notes || '', 'personal');
      }
    }
    const hours = availability.filter(a => a.day === day).map(a => `${a.start}–${a.end}`).join('  ·  ');
    const availableLines = wrap(`${label('availableHours', 'Available hours')}: ${hours || '—'}`, INNER - DAY_LABEL - 30, 20);
    blocks.push({ type: 'available', day, lines: availableLines, height: availableLines.length * 28 + 28 });
  }
  const unallocated = tasks.map(task => {
    const own = sessions.filter(s => s.taskId === task.id);
    const completed = own.filter(s => s.status === 'completed').reduce((n, s) => n + s.end - s.start, 0);
    const planned = own.filter(s => s.status === 'planned').reduce((n, s) => n + s.end - s.start, 0);
    return { task, remaining: Math.max(0, task.duration - completed - planned) };
  }).filter(x => x.remaining > 0);
  if (unallocated.length) {
    blocks.push({ type: 'heading', title: label('unscheduled'), height: 86 });
    for (const { task, remaining } of unallocated) {
      const day = Math.max(0, Math.min(6, Math.floor(task.deadline / 1440)));
      const deadline = `${label('deadline')}: ${days[day]} ${dateFor(day)}, ${endClock(task.deadline)}`;
      cardBlock(null, task.title, `${fmt(remaining)} ${label('remaining')}  ·  ${deadline}`, task.notes || '', task.category === 'personal' ? 'personal' : 'study', 'unscheduled');
    }
  }
  // Paginate only when a dense plan exceeds a safe Canvas dimension.
  const pages = [];
  let page = [], used = HEADER;
  for (let i = 0; i < blocks.length; i++) {
    const block = blocks[i];
    const nextHeight = block.type === 'day' && blocks[i + 1] ? blocks[i + 1].height : 0;
    if (used + block.height + nextHeight + FOOTER > MAX_HEIGHT && page.length) {
      pages.push({ blocks: page, height: used + FOOTER });
      page = []; used = HEADER;
      if (block.type !== 'day' && block.day !== null && block.day !== undefined) {
        page.push({ type: 'day', day: block.day, height: 70 }); used += 70;
      }
    }
    page.push(block); used += block.height;
  }
  if (page.length) pages.push({ blocks: page, height: used + FOOTER });
  const rounded = (ctx, x, y, width, height, radius = 12) => {
    ctx.beginPath();
    ctx.moveTo(x + radius, y); ctx.lineTo(x + width - radius, y); ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
    ctx.lineTo(x + width, y + height - radius); ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx.lineTo(x + radius, y + height); ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx.lineTo(x, y + radius); ctx.quadraticCurveTo(x, y, x + radius, y); ctx.closePath(); ctx.fill();
  };
  for (let index = 0; index < pages.length; index++) {
    const data = pages[index], canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = Math.ceil(data.height);
    const ctx = canvas.getContext('2d', { alpha: false });
    if (!ctx) throw new Error('Canvas is unavailable.');
    ctx.fillStyle = C.white; ctx.fillRect(0, 0, W, canvas.height);
    const line = (value, x, y, size = 24, weight = 400, color = C.text) => {
      ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = color; ctx.textBaseline = 'top'; ctx.fillText(value, x, y);
    };
    line('AI Study Planner', PAD, 58, 40, 700, C.navy);
    line(weekLabel, PAD, 120, 32, 600, C.text);
    const planned = sessions.filter(s => s.status === 'planned').reduce((n, s) => n + s.end - s.start, 0);
    const complete = sessions.filter(s => s.status === 'completed').reduce((n, s) => n + s.end - s.start, 0);
    line(`${label('planned')}: ${fmt(planned)}  ·  ${label('completed')}: ${fmt(complete)}`, PAD, 172, 22, 400, C.muted);
    ctx.fillStyle = C.line; ctx.fillRect(PAD, 218, INNER, 2);
    let y = HEADER;
    for (const block of data.blocks) {
      if (block.type === 'day') {
        line(days[block.day], PAD, y + 16, 29, 700, C.navy);
        line(dateFor(block.day), PAD + 98, y + 20, 23, 400, C.muted);
      } else if (block.type === 'card') {
        const x = PAD + DAY_LABEL;
        ctx.fillStyle = block.status === 'missed' || block.status === 'unscheduled' ? C.amber : block.kind === 'personal' ? C.personal : C.blue;
        rounded(ctx, x, y, INNER - DAY_LABEL, block.height - 12);
        ctx.fillStyle = C.navy; rounded(ctx, x, y + 14, 5, block.height - 40, 2);
        let ty = y + 20;
        for (const item of block.lines) { line(item.value, x + 24, ty, item.size, item.weight, item.color); ty += item.advance; }
      } else if (block.type === 'empty') {
        line(label('noSessions'), PAD + DAY_LABEL + 24, y + 10, 23, 400, C.muted);
      } else if (block.type === 'available') {
        let ty = y + 4;
        for (const value of block.lines) { line(value, PAD + DAY_LABEL + 24, ty, 20, 400, C.muted); ty += 28; }
        ctx.fillStyle = C.line; ctx.fillRect(PAD, y + block.height - 8, INNER, 1);
      } else if (block.type === 'heading') {
        line(block.title, PAD, y + 30, 30, 700, C.navy);
      }
      y += block.height;
    }
    line('AI Study Planner · MVP', PAD, canvas.height - 48, 20, 400, C.muted);
    if (pages.length > 1) line(`${index + 1} / ${pages.length}`, W - PAD - 100, canvas.height - 48, 20, 400, C.muted);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.94));
    if (!blob || !blob.size || blob.type !== 'image/jpeg') throw new Error('The JPG could not be created.');
    const url = URL.createObjectURL(blob), anchor = document.createElement('a');
    const week = /^\d{4}-\d{2}-\d{2}$/.test(state.week) ? state.week : 'week';
    anchor.href = url;
    anchor.download = `study-planner-plan-${week}${pages.length > 1 ? `-part-${index + 1}` : ''}.jpg`;
    document.body.append(anchor); anchor.click(); anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    canvas.width = 1; canvas.height = 1;
  }
  return true;
}

</script></body>
</html>
